# Deploy:  npx wrangler login && npx wrangler secret put GEMINI_API_KEY && npx wrangler deploy
name = "masar-cv"
# waelsaballyl@gmail.com's account; pinned because a wrangler cache from another
# project on the same machine pointed deploys at a different account
account_id = "bcbacc6cc21ac4b7fc20b9141f41f7ae"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# The site calls the worker from these origins only; anything else gets 403.
ALLOWED_ORIGINS = "https://waelsaballyl.github.io,http://localhost:8765"
# Google sign-in (student accounts): the OAuth web client in Google Cloud project
# "masar" (masar-509920) on waelsaballyl@gmail.com. Public by design - it is sent
# to every browser; the client secret is not used and not stored anywhere.
GOOGLE_CLIENT_ID = "444959210306-4p6qenba8lspsc5bmipglj1scifar3ql.apps.googleusercontent.com"

# errors from console.error show in the dashboard under the worker's Logs
[observability]
enabled = true

# Exclusive postings and, later, applications. Schema: schema.sql
[[d1_databases]]
binding = "DB"
database_name = "masar-board"
database_id = "b9d7974f-7726-4a63-a7b2-301a65c585d0"

# Per-IP limits counted across all of Cloudflare's machines (src/index.js limit()).
# period is 10 or 60 seconds. ai: the Gemini paths; write: other POSTs; hit: page
# views; admin: anything taking ADMIN_TOKEN (stops guessing it).
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "HIT_LIMIT"
namespace_id = "1003"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMIT"
namespace_id = "1004"
simple = { limit = 20, period = 60 }
