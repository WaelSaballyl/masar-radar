name: Daily radar collection

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC (06:17 KSA)
  workflow_dispatch: # manual run button

permissions:
  contents: write

# A run started while the previous one is still committing would push a database
# rebuilt from stale files, silently dropping that run's postings.
concurrency:
  group: radar-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/radar.db is not committed: SQLite is binary, so git would store a
      # full copy of a growing file on every daily run. The database is rebuilt
      # from the line-delimited JSON in data/ instead.
      - name: Restore database from committed data
        run: python -m radar.store restore

      - name: Collect jobs
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python -m radar.collect

      # Optional: without GEMINI_API_KEY this is a no-op and the regex results
      # stand. Each posting is sent at most once ever, so a quiet day costs
      # nothing. Never fails the run - a bad day at the API must not stop
      # collection.
      - name: Extract with AI
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m radar.ai --apply

      - name: Export database back to committed data
        run: python -m radar.store export

      - name: Build dashboard
        run: python -m radar.build_dashboard

      - name: Commit results
        run: |
          git config user.name "masar-radar-bot"
          git config user.email "actions@github.com"
          git add data/*.jsonl docs/
          git diff --cached --quiet || git commit -m "radar: daily collection $(date -u +%F)"
          git push
