<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>المتقدمون — مسار</title>
<meta name="theme-color" content="#0E2624">
<meta name="masar-api" content="https://masar-cv.masar-cv.workers.dev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/masar.css?v=15">
</head>
<body>
<div class="wrap">
  <header class="topbar"><a class="wordmark" href="./">مسار</a>
    <div class="tools"><button class="tool" id="theme-toggle" type="button" aria-label="تبديل المظهر">◐</button></div>
  </header>
  <main>
    <div class="page-head">
      <h1 id="head">المتقدمون لإعلانك</h1>
      <p class="section-lede" id="meta" aria-live="polite">نحمّل المتقدمين…</p>
    </div>
    <form class="filters" onsubmit="return false">
      <label class="field">اعرض
        <select id="show"><option value="">الكل</option><option value="new">الجدد</option><option value="shortlisted">القائمة المختصرة</option><option value="rejected">المستبعدون</option></select>
      </label>
    </form>
    <ul class="postings" id="list"></ul>
    <div id="result" hidden>
      <div class="actions">
        <button class="btn btn-primary" type="button" id="print">احفظها PDF</button>
        <button class="btn btn-quiet" type="button" id="close">أغلق السيرة</button>
      </div>
      <article class="paper" id="cv-paper"></article>
    </div>
  </main>
</div>
<script src="assets/core.js?v=15"></script>
<script src="assets/cvkit.js?v=15"></script>
<script src="assets/applicants.js?v=15"></script>
</body>
</html>
