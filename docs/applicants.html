<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">

<meta property="og:type" content="website">
<meta property="og:site_name" content="مسار">
<meta property="og:title" content="المتقدمون — مسار">
<meta property="og:description" content="المتقدمون على إعلانك الحصري في مسار، والبحث في بطاقات الطلاب.">
<meta property="og:image" content="https://waelsaballyl.github.io/masar-radar/assets/brand/og.png">
<meta property="og:url" content="https://waelsaballyl.github.io/masar-radar/applicants.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#0B1219">
<meta name="masar-api" content="https://masar-cv.masar-cv.workers.dev">
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/noto-kufi-arabic-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/masar.css?v=76">
</head>
<body>
<div class="wrap">
  <header class="topbar"><a class="wordmark" href="./" aria-label="مسار، الصفحة الرئيسية"><img class="logo-on-dark" src="assets/brand/wordmark-dark.png?v=2" alt="مسار" width="150" height="48"><img class="logo-on-light" src="assets/brand/wordmark-light.png" alt="" width="151" height="48"></a>
    <div class="tools"><button class="tool" id="theme-toggle" type="button" aria-label="تبديل المظهر">◐</button></div>
  </header>
  <main>
    <div class="page-head">
      <h1 id="head">المتقدمون لإعلانك</h1>
      <p class="section-lede" id="meta" aria-live="polite">نحمّل المتقدمين…</p>
    </div>
    <form class="filters" onsubmit="return false">
      <label class="field">اعرض
        <select id="show"><option value="">الكل</option><option value="new">الجدد</option><option value="shortlisted">القائمة المختصرة</option><option value="rejected">المستبعدون</option></select>
      </label>
    </form>
    <ul class="postings" id="list"></ul>
    <div id="result" hidden>
      <div class="actions">
        <button class="btn btn-primary" type="button" id="print">احفظها PDF</button>
        <button class="btn btn-quiet" type="button" id="close">أغلق السيرة</button>
      </div>
      <article class="paper" id="cv-paper"></article>
    </div>

    <section class="talent-search" id="talent" hidden aria-labelledby="talent-title">
      <div class="page-head"><h2 id="talent-title">ابحث عن مرشحين</h2>
        <p class="section-lede">طلاب اختاروا أن تجدهم الشركات. البطاقات بلا أسماء ولا أرقام: ادعُ من يناسبك، وتصلك سيرته حين يقدّم على إعلانك.</p></div>
      <form class="filters" id="talent-form" onsubmit="return false">
        <label class="field">المجال
          <select id="t-field"><option value="">كل المجالات</option><option value="data">البيانات</option><option value="tech">البرمجة والتقنية</option>
            <option value="finance">المحاسبة والمالية</option><option value="engineering">الهندسة</option><option value="marketing">التسويق</option><option value="hr">الموارد البشرية</option></select>
        </label>
        <label class="field">الدولة
          <select id="t-country"><option value="">كل الدول</option><option value="SA">السعودية</option><option value="AE">الإمارات</option><option value="QA">قطر</option>
            <option value="KW">الكويت</option><option value="BH">البحرين</option><option value="OM">عُمان</option></select>
        </label>
        <label class="field">مهارة أو تخصص<input id="t-q" dir="auto" placeholder="SQL أو محاسبة"></label>
        <button class="btn btn-primary btn-small" type="button" id="t-go">ابحث</button>
      </form>
      <p class="match-meta" id="t-meta" aria-live="polite"></p>
      <ul class="cands" id="cands"></ul>
      <button class="btn btn-quiet btn-small" type="button" id="t-more" hidden>اعرض المزيد</button>
    </section>
  </main>
</div>
<script src="assets/core.js?v=71"></script>
<script src="assets/cvkit.js?v=41"></script>
<script src="assets/applicants.js?v=44"></script>
</body>
</html>
