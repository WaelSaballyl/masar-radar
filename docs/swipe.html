<link rel="preload" href="assets/fonts/noto-kufi-arabic-arabic.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="مسار، الصفحة الرئيسية"><img class="logo-on-dark" src="assets/brand/wordmark-dark.png?v=2" alt="مسار" width="150" height="48"><img class="logo-on-light" src="assets/brand/wordmark-light.png" alt="" width="151" height="48"></a>
    <nav class="nav" aria-label="الأقسام">
      <a href="jobs.html">الإعلانات</a>
      <a href="swipe.html" aria-current="page">قدّم بالسحب</a>
      <a href="applications.html">طلباتي</a>
      <a href="dashboard.html">مؤشر السوق</a>
      <a href="cv.html">سيرتك</a>
      <a href="employers.html">للشركات</a>
    </nav>
    <div class="tools"><button class="tool" id="theme-toggle" type="button" aria-label="تبديل المظهر">◐</button></div>
  </header>

  <main class="swipe-page">
    <div class="page-head">
      <h1>قدّم بالسحب</h1>
      <p class="section-lede">يمين تقدّم، يسار تتخطّى. نرسل لكل إعلان سيرة معدّلة عليه.</p>
      <p class="swipe-try" id="try-demo"><a class="btn btn-quiet btn-small" href="swipe.html?demo=1">شوف مثال بإعلانات وهمية، بدون ما يُرسل شي</a></p>
    </div>

    <section class="swipe-setup step" id="setup" hidden>
      <p id="setup-need"></p>
      <label class="field">لغة السيرة
        <select id="cv-lang"><option value="en">English</option><option value="ar">العربية</option></select>
      </label>
      <label class="consent"><input type="checkbox" id="consent"><span>أوافق أن يرسل مسار سيرتي المعدّلة واسمي وإيميلي وجوالي وروابط حساباتي إلى كل شركة أسحب إعلانها يميناً.</span></label>
      <p class="muted">اقرأ <a href="privacy.html">كيف نتعامل مع بياناتك</a>.</p>
      <div class="setup-actions">
        <button class="btn btn-primary" type="button" id="start">ابدأ</button>
        <button class="btn btn-quiet" type="button" id="later">لاحقاً</button>
      </div>
    </section>

    <ol class="route" id="route" aria-label="إعلانات قدّمت عليها"></ol>

    <div class="feed" id="feed" hidden aria-label="الإعلانات، واحد في كل شاشة"></div>
    <div class="deck" id="deck" aria-live="polite"></div>
    <div class="swipe-buttons" id="buttons" hidden>
      <button class="swipe-btn skip" type="button" id="skip" aria-label="تخطَّ هذا الإعلان">✕<span>تخطَّ</span></button>
      <button class="swipe-btn go" type="button" id="go" aria-label="قدّم على هذا الإعلان">✓<span>قدّم</span></button>
    </div>
    <ul class="swipe-log" id="log"></ul>
    <article class="paper" id="scratch" hidden></article>
  </main>
</div>
<script src="assets/core.js?v=70"></script>
<script src="assets/cvkit.js?v=41"></script>
<script src="assets/swipe.js?v=36"></script>
</body>
</html>
