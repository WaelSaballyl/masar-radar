<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>مراجعة الإعلانات — مسار</title>
<meta name="description" content="مراجعة الإعلانات الحصرية ورسائل الدعم لفريق مسار.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="مسار">
<meta property="og:title" content="مراجعة الإعلانات — مسار">
<meta property="og:description" content="مراجعة الإعلانات الحصرية ورسائل الدعم لفريق مسار.">
<meta property="og:image" content="https://waelsaballyl.github.io/masar-radar/assets/brand/og.png">
<meta property="og:url" content="https://waelsaballyl.github.io/masar-radar/admin.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#0B1219">
<meta name="masar-api" content="https://masar-cv.masar-cv.workers.dev">
<link rel="stylesheet" href="assets/masar.css?v=68">
</head>
<body>
<div class="wrap">
  <header class="topbar"><a class="wordmark" href="./" aria-label="مسار، الصفحة الرئيسية"><img class="logo-on-dark" src="assets/brand/wordmark-dark.png?v=2" alt="مسار" width="150" height="48"><img class="logo-on-light" src="assets/brand/wordmark-light.png" alt="" width="151" height="48"></a>
    <div class="tools"><button class="tool" id="theme-toggle" type="button" aria-label="تبديل المظهر">◐</button></div>
  </header>
  <main>
    <div class="page-head"><h1>مراجعة الإعلانات الحصرية</h1></div>
    <form class="filters" id="login" onsubmit="return false">
      <label class="field grow">رمز الإدارة<input type="password" id="token" autocomplete="current-password" dir="ltr"></label>
      <label class="field">الحالة
        <select id="state"><option value="pending">بانتظار المراجعة</option><option value="approved">منشورة</option><option value="rejected">مرفوضة</option></select>
      </label>
      <button class="btn btn-primary btn-small" type="submit" id="load">اعرض</button>
    </form>
    <p class="match-meta" id="meta" aria-live="polite"></p>
    <ul class="postings" id="list"></ul>

    <section class="support-admin" aria-labelledby="stats-title">
      <div class="page-head"><h2 id="stats-title">الزوار</h2></div>
      <p class="muted small">آخر 30 يوماً. بلا كوكيز ولا عناوين IP: الزائر يُحسب مرة في اليوم لكل متصفح.</p>
      <button class="btn btn-primary btn-small" type="button" id="stats-load">اعرض الأرقام</button>
      <p class="match-meta" id="stats-meta" aria-live="polite"></p>
      <div class="stats" id="stats" hidden>
        <ol class="bars" id="stats-days" aria-label="الزوار كل يوم"></ol>
        <div class="stats-lists">
          <div><h3>أكثر الصفحات</h3><ol id="stats-pages"></ol></div>
          <div><h3>جاؤوا من</h3><ol id="stats-refs"></ol></div>
        </div>
      </div>
    </section>

    <section class="support-admin" aria-labelledby="sup-title">
      <div class="page-head"><h2 id="sup-title">الدعم الفني</h2></div>
      <div class="filters">
        <label class="field">المحادثات
          <select id="sup-state"><option value="open">المفتوحة</option><option value="closed">المغلقة</option></select>
        </label>
        <button class="btn btn-primary btn-small" type="button" id="sup-load">اعرض</button>
      </div>
      <p class="match-meta" id="sup-meta" aria-live="polite"></p>
      <ul class="tickets" id="sup-list"></ul>
      <div class="chat-card" id="sup-chat" hidden>
        <p class="chat-topic" id="sup-who"></p>
        <ol class="bubbles" id="sup-bubbles"></ol>
        <form class="chat-send" id="sup-send">
          <label class="sr-only" for="sup-text">ردّك</label>
          <textarea id="sup-text" rows="3" dir="auto" placeholder="اكتب ردّك…"></textarea>
          <button class="btn btn-primary" type="submit">أرسل</button>
        </form>
        <div class="form-actions">
          <button class="btn btn-quiet btn-small" type="button" id="sup-close">أرسل وأغلق المحادثة</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="assets/core.js?v=60"></script>
<script src="assets/admin.js?v=20"></script>
</body>
</html>
