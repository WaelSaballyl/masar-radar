<body>
<div class="wrap">
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="مسار، الصفحة الرئيسية"><img class="logo-on-dark" src="assets/brand/wordmark-dark.png?v=2" alt="مسار" width="150" height="48"><img class="logo-on-light" src="assets/brand/wordmark-light.png" alt="" width="151" height="48"></a>
    <nav class="nav" aria-label="الأقسام"></nav>
    <div class="tools"><button class="tool" id="theme-toggle" type="button" aria-label="تبديل المظهر">◐</button></div>
  </header>

  <main class="alerts-page">
    <div class="page-head">
      <h1>تنبيهات الوظائف</h1>
      <p class="section-lede">احفظ بحثاً أو شركة، ونعرض لك كل إعلان جديد يطابقه.</p>
    </div>
    <form class="alert-new" id="alert-new">
      <h2>تنبيه جديد</h2>
      <div class="alert-fields">
        <label class="field">مسمى أو مهارة أو شركة<input name="q" dir="auto" placeholder="SQL أو محاسب أو أرامكو"></label>
        <label class="field">المكان
          <select name="where"><option value="">أي مكان</option><option value="gulf">السعودية والخليج</option><option value="SA">السعودية</option>
            <option value="AE">الإمارات</option><option value="QA">قطر</option><option value="KW">الكويت</option><option value="BH">البحرين</option><option value="OM">عُمان</option></select>
        </label>
        <label class="field">النوع
          <select name="type"><option value="">أي نوع</option><option value="training">تدريب بأنواعه</option><option value="coop">تدريب تعاوني</option>
            <option value="internship">تدريب</option><option value="student">دوام طلابي</option><option value="job">وظيفة</option></select>
        </label>
      </div>
      <button class="btn btn-primary" type="submit">أضف التنبيه</button>
      <p class="status" id="new-status" role="status"></p>
    </form>
    <p class="muted" id="alerts-meta" aria-live="polite"></p>
    <div id="alert-list" class="alert-list"></div>
  </main>
</div>
